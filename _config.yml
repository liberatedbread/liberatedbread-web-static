# ============================================================================
#  PHASE 0 MASTER SWITCH — DESIGN §9.6
#
#    true   / is the coming-soon teaser, and the unlaunched site is not
#           advertised to machines
#    false  full launch
#
#  This ONE flag gates all three launch behaviours. There is nothing else to
#  remember, and no way to half-flip it:
#
#    1. the root page ............ _layouts/home.html dispatches on it
#    2. sitemap coverage ......... sitemap.xml lists only / while it is true
#    3. feed autodiscovery ....... _includes/head.html omits the devices feed
#
#  script/check-phase0.rb asserts the BUILT site agrees with this flag, in both
#  positions, and runs in CI. Flipping the flag and forgetting something is a
#  build failure, not a silent leak. See PHASE0.md.
# ============================================================================
phase0: true

title: Liberated Bread
description: >-
  Reclaim your household hardware. Step-by-step guides for liberating abandoned
  IoT devices from dead cloud services.
url: https://liberatedbread.com

# MUST stay empty. The site is served from the apex via CNAME, not from
# /<user>/<repo>/. jekyll-github-metadata otherwise guesses a project-pages
# baseurl ("/pages/liberatedbread/liberatedbread-web-static") whenever it can't
# reach the GitHub API, and every `relative_url` on the site silently breaks.
# script/check-links.rb catches that regression.
baseurl: ""

lang: en

# Required by jekyll-github-metadata, which the github-pages gem loads whenever
# JEKYLL_ENV=production. Without it a production build aborts with
# "No repo name found".
repository: liberatedbread/liberatedbread-web-static
author:
  name: Pigs Can Fly Labs LLC
  url: https://pigscanfly.ca

# pcfweb mailing-list integration (DESIGN §6.3). Kept here so the endpoint and
# the InterestArea slug are defined once and _includes/subscribe-form.html has
# no hardcoded URLs. `next` must stay on the MAILING_LIST_ALLOWED_NEXT_HOSTS
# allowlist over on pcfweb, or the post-signup redirect is rejected.
mailing_list:
  endpoint: https://www.pigscanfly.ca/mailing-list/subscribe
  interest: liberatedbread
  next: https://liberatedbread.com/thanks/

# Device guides (DESIGN §6.1)
collections:
  devices:
    output: true
    permalink: /devices/:slug/

# Ordered least- to most-specific: Jekyll merges matching defaults in
# declaration order, so the devices scope must come last to win.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: devices
    values:
      layout: device

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

# jekyll-feed only feeds `_posts` out of the box. DESIGN §19.2 wants device
# guides in a feed too, so the collection gets its own at /feed/devices.xml.
# /feed.xml stays the site-wide feed named in the site map (§9.2) and is what
# /rss/ redirects to; at Phase 0 it is valid but empty, which §9.6 expects.
feed:
  path: /feed.xml
  collections:
    devices:
      path: /feed/devices.xml

# ============================================================================
#  VENDORED MARKDOWN MUST NOT BECOME PAGES
#
#  `device-specs/` is a git subtree of liberatedbread-protocol-specs (README
#  §"Updating the vendored device specs"). Its Markdown was written for THAT
#  repository's layout, so its relative links point at files that exist there
#  and will never exist here — `../docs/api/spec-format.md`,
#  `../scripts/build_index.py`, `../.github/workflows/ci.yml`.
#
#  The github-pages gem loads several plugins that are NOT listed under
#  `plugins:` above — they ship with the gem and are on by default. Two of them
#  turn plain Markdown into rendered HTML:
#
#    jekyll-readme-index           makes a directory's README.md that
#                                  directory's index.html. This rendered
#                                  device-specs/README.md as
#                                  /device-specs/index.html and published ten
#                                  dead relative links, which is exactly what
#                                  script/check-links.rb failed on.
#    jekyll-optional-front-matter  makes any front-matter-less .md a page. This
#                                  rendered device-specs/research-notes/*.md as
#                                  orphan pages. They carry no relative links
#                                  today — but the next subtree pull is one
#                                  upstream edit away from reintroducing the
#                                  same build failure.
#
#  Both are turned off here rather than naming the offending files in
#  `exclude:` below, and that is the point: the rule is "no vendored Markdown
#  is ever a page", so it keeps holding however upstream reorganises. An
#  exclude list would have to be re-audited on every subtree pull, and
#  jekyll-readme-index would simply promote the next README it found.
#
#  Nothing this repo owns loses anything. Every page here has front matter, and
#  the only other README is this repo's, already excluded below.
#
#  The specs themselves are untouched: YAML and JSON are not Markdown, so
#  device-specs/**/*.{yaml,json} still copy through as static files and keep
#  serving at their public URLs. The vendored .md files still copy through too,
#  readable in raw form — they are simply no longer rendered.
#
#  /device-specs/ is now served by device-specs.md, a landing page this repo
#  owns and can keep honest, instead of by upstream's README.
# ============================================================================
readme_index:
  enabled: false

optional_front_matter:
  enabled: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]

# .well-known/ starts with a dot, so Jekyll skips it by default.
# security.txt (RFC 9116) must be published at /.well-known/security.txt.
include:
  - .well-known

# Never emitted into _site. DESIGN-finalized.md is committed for reference but
# is not a page; the build toolchain is not web content.
#
# device-filter.test.html is a developer tool, not a page. It is excluded for
# two reasons: a test harness has no business on the public site, and it loads
# the script under test with a relative `src="device-filter.js"` so it can be
# opened straight off the filesystem — which script/check-links.rb correctly
# rejects for anything it finds in _site.
exclude:
  - .github/
  - assets/js/device-filter.test.html
  - DESIGN-finalized.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - PHASE0.md
  - README.md
  - node_modules/
  - package-lock.json
  - package.json
  - script/
  - src/
  - tailwind.config.js
  - vendor/

# GitHub Pages ignores this locally-set option, but keeping it explicit means
# `bundle exec jekyll build` and the deploy agree on strict behaviour.
strict_front_matter: true
