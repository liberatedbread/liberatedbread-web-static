# _data/devices.yml — Device catalog for Liberated Bread
# Schema version: 1 (DESIGN Appendix B)
#
# Drives /devices/ and the device grid in _layouts/landing.html. Every entry
# needs a matching guide at _devices/<slug>.md — the cards link to
# /devices/<slug>/ and CI fails the build if that page does not exist.
#
# `image` is optional. The files currently referenced are generated brand
# placeholders (assets/devices/*.webp), not photographs; replace them
# file-for-file when a contributor supplies original photos. Omitting `image`
# entirely is also fine — the card renders a "No photo yet" tile instead.
#
# This file drives the CARDS only, and the cards render slug, name, model, type,
# difficulty, time_minutes, short_desc and image — nothing else here reaches a
# page. `firmware` and `last_verified` used to be mirrored into these entries
# and read by nothing at all, which made them a second, unreviewed copy of the
# guide's strongest factual claims. Verification state now lives in exactly one
# place, the guide's own front matter, where _layouts/device.html gates it
# behind `hardware_verified`. Do not reintroduce them here.

devices:
