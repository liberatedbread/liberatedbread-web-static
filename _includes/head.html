<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- capture page_title -%}
    {%- if page.title and page.title != site.title -%}{{ page.title }} — {{ site.title }}{%- else -%}{{ site.title }}{%- endif -%}
  {%- endcapture -%}
  {%- capture page_desc -%}{{ page.description | default: site.description }}{%- endcapture -%}

  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_desc }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Every brand colour is defined once, in src/input.css, and compiled into
       this file. There is deliberately no inline <style> palette anywhere. -->
  <link rel="stylesheet" href="{{ '/assets/tailwind.css' | relative_url }}">

  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ '/assets/logo.png' | relative_url }}" sizes="128x128">
  <link rel="apple-touch-icon" href="{{ '/assets/logo.png' | relative_url }}">
  <meta name="theme-color" content="#112545">

  <link rel="alternate" type="application/atom+xml"
        title="Liberated Bread"
        href="{{ '/feed.xml' | absolute_url }}">
  <link rel="alternate" type="application/atom+xml"
        title="Liberated Bread — Newly Freed Devices"
        href="{{ '/feed/devices.xml' | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_desc }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/logo.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">
</head>
