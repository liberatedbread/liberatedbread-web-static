<a href="#content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[60] focus:rounded focus:bg-bread-base-dark focus:px-3 focus:py-2 focus:text-bread-accent focus:no-underline">Skip to content</a>

<header class="lb-site-header sticky top-0 z-50 bg-bread-base-dark/90 backdrop-blur border-b border-bread-steel/30">
  <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 no-underline shrink-0">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="40" height="40" class="rounded" loading="eager" decoding="async">
      <span class="font-serif text-lg sm:text-xl text-bread-accent">Liberated Bread</span>
    </a>

    <button
      type="button"
      class="lb-menu-button inline-flex sm:hidden items-center justify-center rounded border border-bread-steel/50 bg-bread-base-dark px-3 py-2 text-bread-accent"
      aria-expanded="false"
      aria-controls="main-navigation"
      hidden>
      <span class="sr-only">Menu</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 17h16"></path>
      </svg>
    </button>

    <nav id="main-navigation" class="lb-main-nav w-full sm:w-auto" aria-label="Main">
      <ul class="lb-main-nav-list flex flex-wrap justify-start sm:justify-end gap-x-4 gap-y-1 text-sm" role="list">
        <li><a href="{{ '/devices/' | relative_url }}">Devices</a></li>
        <li><a href="{{ '/ha-plugins/' | relative_url }}">HA&nbsp;Plugins</a></li>
        <li><a href="{{ '/contribute/' | relative_url }}">Contribute</a></li>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
  (function () {
    var header = document.querySelector(".lb-site-header");
    if (!header) return;

    var button = header.querySelector(".lb-menu-button");
    var nav = header.querySelector("#main-navigation");
    if (!button || !nav) return;

    function setOpen(isOpen, focusButton) {
      header.dataset.menuOpen = isOpen ? "true" : "false";
      button.setAttribute("aria-expanded", isOpen ? "true" : "false");
      if (!isOpen && focusButton && button.getClientRects().length > 0) button.focus();
    }

    header.dataset.navEnhanced = "true";
    button.hidden = false;
    setOpen(false, false);

    button.addEventListener("click", function () {
      setOpen(header.dataset.menuOpen !== "true", false);
    });

    header.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && header.dataset.menuOpen === "true") {
        setOpen(false, true);
      }
    });

    nav.addEventListener("click", function (event) {
      if (event.target.closest && event.target.closest("a")) {
        setOpen(false, false);
      }
    });

    document.addEventListener("click", function (event) {
      if (header.dataset.menuOpen === "true" && !header.contains(event.target)) {
        setOpen(false, false);
      }
    });
  }());
</script>
